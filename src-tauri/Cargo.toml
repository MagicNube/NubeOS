[package]
name = "nubeos"
version = "0.1.0"
description = "Tu espacio personal privado"
authors = ["Jesús"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nubeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rusqlite_migration = "1.3.1"
